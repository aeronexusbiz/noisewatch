<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AeroNexus NoiseWatch · 3D 보기</title>
<link rel="icon" href="/img/brand/favicon-32.png">
<link rel="stylesheet" href="/noise-3d.css?v=6">
<link rel="stylesheet" href="/noise-shell.css?v=8">                <!-- 공통 머리(GNB) -->
<link rel="stylesheet" href="/noise-icons.css?v=1">
<script src="/noise-icons.js?v=8"></script>
<link rel="stylesheet" href="/noise-role.css?v=1">
<script src="/noise-role.js?v=1"></script>
<script src="/noise-offline.js?v=4"></script>                       <!-- 수집 서버 쉬는 중 안내 — 화면 fetch 보다 먼저 -->
<script src="/noise-brief.js?v=5"></script>                         <!-- NoiseBrief.level(db) — 색·말 하나로 -->
<link rel="stylesheet" href="/noise-theme-light.css?v=18">
<script src="/noise-theme.js?v=3"></script>
<link rel="stylesheet" href="/noise-mobile.css?v=22">               <!-- 폰 화면 — 맨 뒤에 -->
</head>
<body data-gnb-page="3d" class="n3-body">
<!-- 화면: 일반·기관 둘 다 (2026-11-02 운영자 「소음와치 3D 모드와 항공기도 3D로」) -->
<header class="n3-top" data-gnb-src>
  <select id="n3Apt" aria-label="공항" data-gnb="apt"><option value="RKSS">김포 RKSS</option></select>
  <span data-gnb="sim" class="n3-sim" title="실제 측정기가 없어 항적에서 추정한 값입니다(±5~10dB). 실측·법적 판단에 쓰지 않습니다.">항적 기반 예측</span>
  <span class="n3-clock" id="n3Clock" data-gnb="clock">--:--:--</span>
</header>
<main class="n3-main">
  <canvas id="n3c" aria-label="김포공항 주변 3D 지도 — 항공기와 소음 측정 지점"></canvas>
  <div class="n3-ck" id="n3Ck" hidden aria-hidden="true">                <!-- 조종석 창틀·계기(11-02 · AeroNexus 3D착륙 조종석 시점 참고 · 그림은 새로 그림) -->
    <svg class="n3-ck-frame" viewBox="0 0 1000 600" preserveAspectRatio="none">
      <path d="M0 0H1000V600H0Z M40 70 L470 40 L478 360 L60 380 Z M530 40 L960 70 L940 380 L522 360 Z" fill-rule="evenodd" fill="#1a1f26"/>
      <path d="M40 70 L470 40 L478 360 L60 380 Z M530 40 L960 70 L940 380 L522 360 Z" fill="none" stroke="#2c333d" stroke-width="10"/>
      <path d="M0 395 Q500 350 1000 395 V600 H0 Z" fill="#14181e"/>
    </svg>
    <div class="n3-ck-panel">
      <div class="n3-ck-pfd">
        <svg viewBox="-60 -60 120 120" class="n3-ck-ai"><defs><clipPath id="ckClip"><rect x="-50" y="-50" width="100" height="100" rx="8"/></clipPath></defs>
          <g clip-path="url(#ckClip)"><g id="ckHor"><rect x="-120" y="-160" width="240" height="160" fill="#2f7fd1"/><rect x="-120" y="0" width="240" height="160" fill="#7a4f2a"/><line x1="-120" y1="0" x2="120" y2="0" stroke="#fff" stroke-width="1.2"/>
            <g stroke="#fff" stroke-width=".8"><line x1="-12" y1="-15" x2="12" y2="-15"/><line x1="-12" y1="15" x2="12" y2="15"/><line x1="-6" y1="-7.5" x2="6" y2="-7.5"/><line x1="-6" y1="7.5" x2="6" y2="7.5"/></g></g></g>
          <path d="M-30 0H-10L-6 5M30 0H10L6 5" stroke="#facc15" stroke-width="3" fill="none"/><circle r="1.8" fill="#facc15"/>
        </svg>
        <div class="n3-ck-tape l"><small>속도 kt</small><b id="ckSpd">0</b></div>
        <div class="n3-ck-tape r"><small>고도 ft</small><b id="ckAlt">0</b><small id="ckVs">0</small></div>
      </div>
      <div class="n3-ck-nd">
        <svg viewBox="-60 -60 120 120"><circle r="48" fill="none" stroke="#3b4656" stroke-width="1.2"/><g id="ckRose">
          <text y="-38" text-anchor="middle" fill="#e2e8f0" font-size="9">N</text><text x="40" y="3" text-anchor="middle" fill="#94a3b8" font-size="8">E</text><text y="44" text-anchor="middle" fill="#94a3b8" font-size="8">S</text><text x="-40" y="3" text-anchor="middle" fill="#94a3b8" font-size="8">W</text></g>
          <path d="M0 -20 L5 8 L0 4 L-5 8 Z" fill="#f8fafc"/></svg>
        <b id="ckHdg">000°</b><span id="ckPh"></span><span class="db">소음 <b id="ckDb">–</b></span>
      </div>
    </div>
  </div>
  <div class="n3-fbar" id="n3FBar" role="group" aria-label="고른 항공기 보기" hidden>
    <b id="n3FName" translate="no"></b>
    <button type="button" data-f="chase" aria-pressed="true">뒤따라가기</button><button type="button" data-f="cockpit" aria-pressed="false">조종석</button><button type="button" data-f="orbit" aria-pressed="false">주변 돌아보기</button><button type="button" id="n3FStop">그만</button>
  </div>
  <div id="n3Load" class="n3-load" role="status">3D 지도를 불러오는 중… <span id="n3Pct"></span></div>
  <section class="n3-panel" id="n3Panel" aria-label="3D 보기 조절">
    <button type="button" class="n3-fold" id="n3Fold" aria-expanded="true" aria-controls="n3Body">조절판 접기</button>
    <div id="n3Body">
    <div class="n3-row n3-views" role="group" aria-label="시점">
      <button type="button" data-v="over" class="on">공항 전체</button><button type="button" data-v="rwy">활주로</button><button type="button" data-v="town">신월동 쪽</button><button type="button" data-v="top">위에서</button>
    </div>
    <div class="n3-row" role="group" aria-label="돌리기">
      <button type="button" id="n3L">왼쪽으로 30°</button><button type="button" id="n3R">오른쪽으로 30°</button><button type="button" id="n3Spin" aria-pressed="false">천천히 돌기</button>
    </div>
    <label class="n3-chk"><input type="checkbox" id="n3Wave" checked> 이착륙 소음 퍼짐</label>
    <label class="n3-chk"><input type="checkbox" id="n3Sen" checked> 측정 지점</label>
    <label class="n3-chk"><input type="checkbox" id="n3Trail" checked> 지나온 길</label>
    <label class="n3-chk"><input type="checkbox" id="n3Big" checked> 항공기 크게(×3)</label>
    <div class="n3-legend" aria-label="퍼지는 원 색">
      <span><i style="background:#facc15"></i>60 dB</span><span><i style="background:#fb923c"></i>65 dB</span><span><i style="background:#ef4444"></i>70 dB</span>
      <p>이착륙 중인 항공기에서 그 소음이 닿는 거리까지 원이 천천히 퍼집니다. 항공기를 누르면 뒤따라가기·조종석 보기를 고를 수 있습니다. 항적에서 추정한 값입니다(±5~10dB).</p>
    </div>
    <div class="n3-list" id="n3List" aria-live="polite"></div>
    </div>
  </section>
  <div class="n3-credit">위성 VWorld(국토교통부) · 지형 Copernicus DEM © DLR/Airbus · 건물·공항 일부 © OpenStreetMap 기여자(ODbL) · 도로 국가표준노드링크 · 청사 모형은 공개 사진 참고 추정</div>
</main>
<script src="/noise-shell.js?v=8"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module" src="/noise-3d.js?v=6"></script>
</body>
</html>
